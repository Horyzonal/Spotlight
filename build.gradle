}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Validate release contents, licenses, entrypoints and Mixin classes.'
    dependsOn tasks.named('reobfJar'), tasks.named('testClasses')
    inputs.file(tasks.named('reobfJar').flatMap { it.archiveFile })
    doLast {
        def archive = tasks.named('reobfJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def names = zip.entries().collect { it.name }.toSet()
            def requireEntry = { String name ->
                if (!names.contains(name)) throw new GradleException("Release JAR missing ${name}")
            }
            ['META-INF/mods.toml', 'LICENSE', 'THIRD_PARTY_NOTICES'].each(requireEntry)
            ['LICENSE', 'THIRD_PARTY_NOTICES'].each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    if (it.bytes != project.file(name).bytes) throw new GradleException("Release JAR changed ${name}")
                }
            }
            def resources = sourceSets.main.output.resourcesDir
            if (resources.exists()) resources.eachFileRecurse { file ->
                if (file.isFile()) requireEntry(resources.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
            }
            def unwanted = names.findAll { name ->
                name.startsWith('net/minecraft/') ||
                    name ==~ /dev\/.*Check(?:Kt)?(?:\$.*)?\.class/ ||
                    name ==~ /.*(?:^|\/)(?:\.DS_Store|\._[^\/]*|\.gradle|\.kotlin|\.idea|\.vscode|build|bin|run|logs|crash-reports|\.env(?:\..*)?)(?:\/.*)?/ ||
                    name.endsWith('.hprof') || name.endsWith('.sh') || name.endsWith('.bat') ||
                    name.endsWith('.launch') || name.endsWith('.vmoptions')
            }
            sourceSets.test.output.classesDirs.each { dir ->
                if (dir.exists()) dir.eachFileRecurse { file ->
                    def name = dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    if (file.isFile() && name.endsWith('.class') && names.contains(name)) unwanted.add(name)
                }
            }
            names.findAll { !it.endsWith('/') && !it.endsWith('.jar') }.each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    def content = new String(it.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (content.contains('-agentlib:jdwp') || content.contains('-Xrunjdwp')) unwanted.add(name)
                }
            }
            if (unwanted) throw new GradleException("Release JAR contains development or Minecraft files: ${unwanted}")
            def readJson = { String name ->
                requireEntry(name)
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    new groovy.json.JsonSlurper().parse(it, 'UTF-8')
                }
            }
            def requireClass = { String name -> requireEntry(name.replace('.', '/') + '.class') }
            def metadata = zip.getInputStream(zip.getEntry("META-INF/mods.toml")).withCloseable {
                new com.electronwill.nightconfig.toml.TomlParser().parse(new InputStreamReader(it, "UTF-8"))
            }
            def mod = metadata.get("mods").find { it.get("modId") == "spotlight" }
            if (mod == null || mod.get("version") != project.version.toString() ||
                metadata.get("license") != "MIT" || mod.get("authors") != "Horyzonal") {
                throw new GradleException("Release metadata mismatch")
            }
            requireClass("dev.spotlight.platform.SpotlightClient")
            def entrypoint = zip.getInputStream(zip.getEntry('dev/spotlight/platform/SpotlightClient.class')).withCloseable {
                new String(it.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            }
            if (!entrypoint.contains('Lnet/minecraftforge/fml/common/Mod;')) {
                throw new GradleException('SpotlightClient missing Forge @Mod entrypoint')
            }
            if (metadata.get('modLoader') != 'kotlinforforge' || metadata.get('loaderVersion') != '[4.12,5)') {
                throw new GradleException('Release Kotlin language loader mismatch')
            }
            def dependencies = metadata.get('dependencies.spotlight')
            ['forge': '[47.1,48)', 'minecraft': '[1.20.1]', 'kotlinforforge': '[4.12,5)'].each { id, range ->
                if (!dependencies.any { it.get('modId') == id && it.get('versionRange') == range && it.get('mandatory') == true }) {
                    throw new GradleException("Release dependency mismatch: ${id}")
                }
            }
            def config = readJson("spotlight.mixins.json")
            ["mixins", "client", "server"].each { side ->
                (config[side] ?: []).each { requireClass(config.package ? "${config.package}.${it}" : it) }
            }
            if (config.plugin) requireClass(config.plugin)
            requireEntry("spotlight.refmap.json")
            def refmap = readJson('spotlight.refmap.json')
            if (!refmap.mappings || !groovy.json.JsonOutput.toJson(refmap).find(/(?:m|f)_\d+_/)) {
                throw new GradleException('Missing production SRG Mixin mappings')
            }
            if (config.refmap != 'spotlight.refmap.json') throw new GradleException('Mixin config missing production refmap')
            names.findAll { it.endsWith(".class") }.each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    def bytes = it.bytes
                    if (java.nio.ByteBuffer.wrap(bytes).getShort(6) != 61) throw new GradleException("Not Java 17: ${name}")
                    if (new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains("net/fabricmc/")) {
                        throw new GradleException("Fabric reference: ${name}")
                    }
                }
            }
            if (names.contains("fabric.mod.json")) throw new GradleException("Fabric metadata in Forge release")
            logger.lifecycle("Release JAR validated: ${archive.name} (${names.size()} entries)")
        }
    }
}

tasks.register('prepareKotlinLoader', Copy) {
    from configurations.runtimeClasspath.files.findAll { it.name == "kotlinforforge-${kff_version}-all.jar" }
    into file("run/${project.loader}-${minecraft_version}/mods")
}

tasks.named('prepareClientRun') { dependsOn 'prepareKotlinLoader' }

def launcherJar = tasks.register('launcherJar', Jar) {
    from sourceSets.launcher.output
    archiveClassifier = 'test-launcher'
    destinationDirectory = layout.buildDirectory.dir('test-launcher')
}

[
    musicPreferencesCheck: 'dev.spotlight.core.MusicPreferencesCheck',
    musicNavigationCheck: 'dev.spotlight.ui.MusicNavigationCheck',
    nbtCompletionCheck: 'dev.spotlight.core.NbtCompletionCheck',
    clientItemStorageCheck: 'dev.spotlight.platform.ClientItemStorageCheck',
    itemFactsCheck: 'dev.spotlight.platform.ItemFactsCheck',

    headDatabaseCheck: 'dev.spotlight.platform.HeadDatabaseCheck',
    remoteHeadsCheck: 'dev.spotlight.platform.NewRemoteHeadsCheck',
    customEnchantmentsCheck: 'dev.spotlight.platform.CustomEnchantmentsCheck',
    enchantmentCompatibilityCheck: 'dev.spotlight.ui.EnchantmentCompatibilityCheck',
].each { taskName, entrypoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entrypoint
        enableAssertions = true
    }
    tasks.named('check') { dependsOn taskName }
}

tasks.withType(JavaExec).configureEach {
    if (name.endsWith('Check') && name != 'coreCheck') {
        def checkMain = mainClass.get()
        dependsOn 'prepareClientRun', launcherJar
        mainClass = 'cpw.mods.bootstraplauncher.BootstrapLauncher'
        doFirst {
            def moddev = layout.buildDirectory.dir('moddev').get().asFile
            def legacy = new File(moddev, 'clientLegacyClasspath.txt').readLines().findAll { !it.contains('/thedarkcolour/') }

            def checkLegacy = new File(moddev, 'checkLegacyClasspath.txt')
            checkLegacy.text = (legacy + [launcherJar.get().archiveFile.get().asFile.absolutePath]).join(System.lineSeparator())
            def vm = new File(moddev, 'clientRunVmArgs.txt').readLines().findAll { it && !it.startsWith('#') && it != '-XstartOnFirstThread' }
            vm = vm.findAll { !it.startsWith('-DlegacyClassPath.file=') }
            jvmArgs vm
            systemProperty 'legacyClassPath.file', checkLegacy.absolutePath
            systemProperty 'spotlight.check.main', checkMain
            systemProperty 'fml.earlyprogresswindow', 'false'
            def program = new File(moddev, 'clientRunProgramArgs.txt').readLines().findAll { it && !it.startsWith('#') }
            program.remove(0)
            program[program.indexOf('--launchTarget') + 1] = 'spotlightclientchecks'
            def checkGame = layout.buildDirectory.dir('check-run').get().asFile
            checkGame.mkdirs()
            copy {
                from configurations.runtimeClasspath.files.findAll { it.name == "kotlinforforge-${kff_version}-all.jar" }
                into new File(checkGame, 'mods')
            }
            workingDir checkGame
            program[program.indexOf('--gameDir') + 1] = checkGame.absolutePath
            if (name == 'remoteHeadsCheck' && project.hasProperty('liveHeads')) systemProperty 'spotlight.check.liveHeads', 'true'
            args = program

            environment 'MOD_CLASSES', ((sourceSets.main.output.classesDirs.files + [sourceSets.main.output.resourcesDir, sourceSets.test.output.resourcesDir] + sourceSets.test.output.classesDirs.files).collect { "spotlight%%${it.absolutePath}" } ).join(File.pathSeparator)
        }
    }
}

tasks.named('check') {
    dependsOn 'releaseCheck'
}

tasks.named('test') {
}

tasks.named('check') {
    dependsOn 'coreCheck', 'platformCheck', 'paletteCheck', 'requestedCoreCheck', 'commandSuggestionCheck', 'paletteShortcutCheck', 'macroCheck', 'macroRuntimeCheck', 'themeCheck', 'menuLayoutCheck', 'macroCompletionCheck', 'addLocationCheck', 'nearestBlockSearchCheck', 'blockHitActionsCheck', 'paletteClickCheck', 'extendedOptionsCheck', 'runnerGamesCheck', 'puzzleGamesCheck', 'styledTextCheck', 'creativeBannerCheck', 'textEditorCheck', 'colorPickerCheck', 'regionSelectionCheck', 'ingredientAllocationCheck', 'recipeIndexCheck', 'soundControlsCheck', 'musicTracksCheck', 'nowPlayingWidgetCheck', 'themeLibraryCheck', 'bannerPatternGridCheck', 'serverPluginsCheck'
}
