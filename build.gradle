tasks.withType(Jar).configureEach {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

tasks.named('jar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES')
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Validate release contents, licenses, entrypoints and Mixin classes.'
    dependsOn tasks.named('jar'), tasks.named('testClasses')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def names = zip.entries().collect { it.name }.toSet()
            def requireEntry = { String name ->
                if (!names.contains(name)) throw new GradleException("Release JAR missing ${name}")
            }
            ['fabric.mod.json', 'LICENSE', 'THIRD_PARTY_NOTICES'].each(requireEntry)
            ['LICENSE', 'THIRD_PARTY_NOTICES'].each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    if (it.bytes != project.file(name).bytes) throw new GradleException("Release JAR changed ${name}")
                }
            }
            def resources = sourceSets.main.output.resourcesDir
            if (resources.exists()) resources.eachFileRecurse { file ->
                if (file.isFile()) requireEntry(resources.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
            }
            def unwanted = names.findAll { name ->
                name.startsWith('net/minecraft/') ||
                    name ==~ /dev\/.*Check(?:Kt)?(?:\$.*)?\.class/ ||
                    name ==~ /.*(?:^|\/)(?:\.DS_Store|\._[^\/]*|\.gradle|\.kotlin|\.idea|\.vscode|build|bin|run|logs|crash-reports|\.env(?:\..*)?)(?:\/.*)?/ ||
                    name.endsWith('.hprof') || name.endsWith('.sh') || name.endsWith('.bat') ||
                    name.endsWith('.launch') || name.endsWith('.vmoptions')
            }
            sourceSets.test.output.classesDirs.each { dir ->
                if (dir.exists()) dir.eachFileRecurse { file ->
                    def name = dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    if (file.isFile() && name.endsWith('.class') && names.contains(name)) unwanted.add(name)
                }
            }
            names.findAll { !it.endsWith('/') && !it.endsWith('.jar') }.each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    def content = new String(it.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (content.contains('-agentlib:jdwp') || content.contains('-Xrunjdwp')) unwanted.add(name)
                }
            }
            if (unwanted) throw new GradleException("Release JAR contains development or Minecraft files: ${unwanted}")
            def readJson = { String name ->
                requireEntry(name)
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    new groovy.json.JsonSlurper().parse(it, 'UTF-8')
                }
            }
            def requireClass = { String name -> requireEntry(name.replace('.', '/') + '.class') }
            def metadata = readJson('fabric.mod.json')
            if (metadata.version != project.version.toString() || metadata.license != 'MIT' || metadata.authors != ['Horyzonal']) {
                throw new GradleException('Release metadata version, license or authors mismatch')
            }
            metadata.entrypoints.values().flatten().each { entry ->
                requireClass((entry instanceof Map ? entry.value : entry).split('::', 2)[0])
            }
            metadata.mixins.each { entry ->
                def config = readJson(entry instanceof Map ? entry.config : entry)
                ['mixins', 'client', 'server'].each { side ->
                    (config[side] ?: []).each { requireClass(config.package ? "${config.package}.${it}" : it) }
                }
                if (config.plugin) requireClass(config.plugin)
                if (config.refmap) requireEntry(config.refmap)
            }
            if (metadata.accessWidener) requireEntry(metadata.accessWidener)
            (metadata.jars ?: []).each { requireEntry(it.file) }
            logger.lifecycle("Release JAR validated: ${archive.name} (${names.size()} entries)")
        }
    }
}

tasks.named('check') {
    dependsOn 'releaseCheck'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn 'coreCheck', 'platformCheck', 'paletteCheck', 'requestedCoreCheck', 'commandSuggestionCheck', 'paletteShortcutCheck', 'macroCheck', 'macroRuntimeCheck', 'themeCheck', 'menuLayoutCheck', 'macroCompletionCheck', 'addLocationCheck', 'nearestBlockSearchCheck', 'blockHitActionsCheck', 'paletteClickCheck', 'extendedOptionsCheck', 'runnerGamesCheck', 'puzzleGamesCheck', 'styledTextCheck', 'creativeBannerCheck', 'textEditorCheck', 'colorPickerCheck', 'regionSelectionCheck', 'ingredientAllocationCheck', 'recipeIndexCheck', 'soundControlsCheck', 'musicTracksCheck', 'nowPlayingWidgetCheck', 'themeLibraryCheck', 'bannerPatternGridCheck', 'serverPluginsCheck'
}
