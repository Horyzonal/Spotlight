plugins {
    id 'net.fabricmc.fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
}

base {
    archivesName = "spotlight-mc${minecraft_version}"
}

kotlin {
    jvmToolchain(java_version.toInteger())
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

loom {
    runs {
        client {
            runDir "run/${minecraft_version}"
            if (project.hasProperty('clientDebug')) {
                vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
        }
    }
}

