tasks.withType(Jar).configureEach {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

tasks.named('jar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES')
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Validate release contents, licenses, entrypoints and Mixin classes.'
    dependsOn tasks.named('jar'), tasks.named('testClasses')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def names = zip.entries().collect { it.name }.toSet()
            def requireEntry = { String name ->
                if (!names.contains(name)) throw new GradleException("Release JAR missing ${name}")
            }
            ['META-INF/neoforge.mods.toml', 'LICENSE', 'THIRD_PARTY_NOTICES'].each(requireEntry)
            ['LICENSE', 'THIRD_PARTY_NOTICES'].each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    if (it.bytes != project.file(name).bytes) throw new GradleException("Release JAR changed ${name}")
                }
            }
            def resources = sourceSets.main.output.resourcesDir
            if (resources.exists()) resources.eachFileRecurse { file ->
                if (file.isFile()) requireEntry(resources.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
            }
            def unwanted = names.findAll { name ->
                name.startsWith('net/minecraft/') || name.startsWith('net/fabricmc/') ||
                                    name.startsWith('kotlin/') || name.startsWith('thedarkcolour/') ||
                                    name == 'fabric.mod.json' || name.endsWith('.jar') ||
                    name ==~ /dev\/.*Check(?:Kt)?(?:\$.*)?\.class/ ||
                    name ==~ /.*(?:^|\/)(?:\.DS_Store|\._[^\/]*|\.gradle|\.kotlin|\.idea|\.vscode|build|bin|run|logs|crash-reports|\.env(?:\..*)?)(?:\/.*)?/ ||
                    name.endsWith('.hprof') || name.endsWith('.sh') || name.endsWith('.bat') ||
                    name.endsWith('.launch') || name.endsWith('.vmoptions')
            }
            sourceSets.test.output.classesDirs.each { dir ->
                if (dir.exists()) dir.eachFileRecurse { file ->
                    def name = dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    if (file.isFile() && name.endsWith('.class') && names.contains(name)) unwanted.add(name)
                }
            }
            names.findAll { !it.endsWith('/') && !it.endsWith('.jar') }.each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    def content = new String(it.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (content.contains('-agentlib:jdwp') || content.contains('-Xrunjdwp') ||
                                            content.contains('net/fabricmc/') || content =~ /net\/minecraft\/class_\d+/) unwanted.add(name)
                }
            }
            if (unwanted) throw new GradleException("Release JAR contains development or Minecraft files: ${unwanted}")
            def readJson = { String name ->
                requireEntry(name)
                zip.getInputStream(zip.getEntry(name)).withCloseable {
                    new groovy.json.JsonSlurper().parse(it, 'UTF-8')
                }
            }
            def requireClass = { String name -> requireEntry(name.replace('.', '/') + '.class') }
            def metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).withCloseable {
                org.tomlj.Toml.parse(it)
            }
            if (metadata.hasErrors()) throw new GradleException("Invalid NeoForge metadata: ${metadata.errors()}")
            def mod = metadata.getArray('mods').getTable(0)
            if (metadata.getString('modLoader') != 'kotlinforforge' || metadata.getString('loaderVersion') != '[5.12,6)' ||
                metadata.getString('license') != 'MIT' || mod.getString('modId') != 'spotlight' ||
                mod.getString('version') != project.version.toString() || mod.getString('authors') != 'Horyzonal' ||
                mod.getString('displayTest') != 'IGNORE_ALL_VERSION') {
                throw new GradleException('Release metadata loader, version, license, authors or client compatibility mismatch')
            }
            def dependencies = metadata.getArray('dependencies.spotlight')
            ['minecraft': '[1.21.1]', 'neoforge': '[21.1.265,21.2)', 'kotlinforforge': '[5.12.0,6)'].each { id, range ->
                def dependency = (0..<dependencies.size()).collect { dependencies.getTable(it) }.find { it.getString('modId') == id }
                if (dependency == null || dependency.getString('type') != 'required' ||
                    dependency.getString('versionRange') != range || dependency.getString('side') != 'CLIENT') {
                    throw new GradleException("Release dependency missing or mismatched: ${id}")
                }
            }
            requireClass('dev.spotlight.platform.SpotlightClient')
            def entrypoint = zip.getInputStream(zip.getEntry('dev/spotlight/platform/SpotlightClient.class')).withCloseable {
                new String(it.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            }
            if (!entrypoint.contains('Lnet/neoforged/fml/common/Mod;') || !entrypoint.contains('Lnet/neoforged/api/distmarker/Dist;') ||
                !entrypoint.contains('CLIENT') || !entrypoint.contains('spotlight')) {
                throw new GradleException('Release entrypoint must declare @Mod(value = "spotlight", dist = Dist.CLIENT)')
            }
            names.findAll { it.endsWith('.class') }.each { name ->
                zip.getInputStream(zip.getEntry(name)).withCloseable { stream ->
                    def data = new DataInputStream(stream)
                    if (data.readInt() != (int) 0xCAFEBABE) throw new GradleException("Invalid class: ${name}")
                    data.readUnsignedShort()
                    if (data.readUnsignedShort() != 65) throw new GradleException("Class must target Java 21: ${name}")
                }
            }
            def mixins = metadata.getArray('mixins')
            if (mixins == null || mixins.size() != 1 || mixins.getTable(0).getString('config') != 'spotlight.mixins.json') {
                throw new GradleException('Release mixin registration mismatch')
            }
            (0..<mixins.size()).each { index ->
                def config = readJson(mixins.getTable(index).getString('config'))
                ['mixins', 'client', 'server'].each { side ->
                    (config[side] ?: []).each { requireClass(config.package ? "${config.package}.${it}" : it) }
                }
                if (config.plugin) requireClass(config.plugin)
                if (config.refmap) requireEntry(config.refmap)
            }

            logger.lifecycle("Release JAR validated: ${archive.name} (${names.size()} entries)")
        }
    }
}

tasks.named('check') {
    dependsOn 'releaseCheck'
}

[
    neoForgeHooksCheck: 'dev.spotlight.platform.NeoForgeHooksCheck',
    musicPreferencesCheck: 'dev.spotlight.core.MusicPreferencesCheck',
    musicNavigationCheck: 'dev.spotlight.ui.MusicNavigationCheck',
    nbtCompletionCheck: 'dev.spotlight.core.NbtCompletionCheck',
    clientItemStorageCheck: 'dev.spotlight.platform.ClientItemStorageCheck',
    itemFactsCheck: 'dev.spotlight.platform.ItemFactsCheck',

    headDatabaseCheck: 'dev.spotlight.platform.HeadDatabaseCheck',
    remoteHeadsCheck: 'dev.spotlight.platform.NewRemoteHeadsCheck',
    customEnchantmentsCheck: 'dev.spotlight.platform.CustomEnchantmentsCheck',
    enchantmentCompatibilityCheck: 'dev.spotlight.ui.EnchantmentCompatibilityCheck',
].each { taskName, entrypoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entrypoint
        enableAssertions = true
    }
    tasks.named('check') { dependsOn taskName }
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn 'coreCheck', 'platformCheck', 'paletteCheck', 'requestedCoreCheck', 'commandSuggestionCheck', 'paletteShortcutCheck', 'macroCheck', 'macroRuntimeCheck', 'themeCheck', 'menuLayoutCheck', 'macroCompletionCheck', 'addLocationCheck', 'nearestBlockSearchCheck', 'blockHitActionsCheck', 'paletteClickCheck', 'extendedOptionsCheck', 'runnerGamesCheck', 'puzzleGamesCheck', 'styledTextCheck', 'creativeBannerCheck', 'textEditorCheck', 'colorPickerCheck', 'regionSelectionCheck', 'ingredientAllocationCheck', 'recipeIndexCheck', 'soundControlsCheck', 'musicTracksCheck', 'nowPlayingWidgetCheck', 'themeLibraryCheck', 'bannerPatternGridCheck', 'serverPluginsCheck'
}
