buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.tomlj:tomlj:1.1.1' }
}

plugins {
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"
}

base {
    archivesName = "spotlight-neoforge-mc${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

kotlin {
    jvmToolchain(25)
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    compilerOptions.freeCompilerArgs.add("-Xjdk-release=21")
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo sourceSets.test
    mods {
        spotlight {
            sourceSet sourceSets.main
        }
    }
    unitTest {
        enable()
        testedMod = mods.spotlight
    }
    runs {
        client {
            client()
            gameDirectory = project.file("run/neoforge-${minecraft_version}")
            if (project.hasProperty('clientDebug')) {
                jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
        }
    }
}

tasks.withType(JavaExec).configureEach {
    if (name.endsWith('Check')) {
        dependsOn tasks.named('prepareNeoForgeTestFiles')
        doFirst {
            def entrypoint = mainClass.get()
            def testTask = tasks.named('test').get()
            workingDir = testTask.workingDir
            systemProperties testTask.systemProperties
            jvmArgs testTask.jvmArgs
            testTask.jvmArgumentProviders.each { jvmArgs it.asArguments() }
            mainClass = 'dev.spotlight.validation.NeoForgeCheckLauncher'
            args entrypoint
            if (name == 'remoteHeadsCheck' && project.hasProperty('liveHeads')) args '--live'
        }
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

