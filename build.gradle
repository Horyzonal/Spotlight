buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'com.electronwill.night-config:toml:3.6.6' }
}

plugins {
    id 'net.neoforged.moddev.legacyforge'
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenCentral()
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge:${kff_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

base {
    archivesName = "spotlight-forge-mc${minecraft_version}"
}

kotlin {
    jvmToolchain(17)
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    compilerOptions.freeCompilerArgs.add("-Xjdk-release=17")
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('buildClasspath') {
    group = 'help'
    description = 'Write resolved main/test classpaths for porting and loader harnesses.'
    dependsOn 'createMinecraftArtifacts'
    doLast {
        def directory = layout.buildDirectory.dir('classpath').get().asFile
        directory.mkdirs()
        new File(directory, 'main.txt').text = sourceSets.main.compileClasspath.asPath
        new File(directory, 'test.txt').text = sourceSets.test.runtimeClasspath.asPath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

sourceSets {
    launcher
}
configurations.launcherImplementation.extendsFrom configurations.implementation

if (!(loader in ['forge', 'neoforge'])) throw new GradleException('Use -Ploader=forge or -Ploader=neoforge')
layout.buildDirectory = file(loader == 'forge' ? 'build' : 'build/neoforge')
legacyForge {
    enable {
        if (project.loader == 'neoforge') neoForgeVersion = project.neoforge_version
        else forgeVersion = project.forge_version
        disableRecompilation = true
    }
    runs {
        client {
            client()

            gameDirectory = file("run/${project.loader}-${minecraft_version}")
            if (project.hasProperty('clientDebug')) {
                jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
        }
    }
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.launcher
    mods {
        spotlight { sourceSet sourceSets.main }
    }
}

mixin {
    add sourceSets.main, 'spotlight.refmap.json'
    config 'spotlight.mixins.json'
}

