pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
        id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    }
}
rootProject.name = 'spotlight'
