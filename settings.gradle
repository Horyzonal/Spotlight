pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'net.neoforged.moddev' version "${moddev_version}"
        id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    }
}
rootProject.name = 'spotlight'
